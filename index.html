<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Error Page</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --danger: #dc2626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #eff6ff 0%, #f8fafc 100%);
      color: var(--text);
      padding: 24px;
    }

    .error-card {
      width: min(100%, 560px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
      padding: 40px 32px;
      text-align: center;
    }

    .error-code {
      font-size: 72px;
      font-weight: 800;
      color: var(--danger);
      line-height: 1;
      margin-bottom: 14px;
    }

    .error-title {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .error-message {
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.7;
      margin-bottom: 26px;
    }

    .error-note {
      margin-top: 16px;
      color: var(--muted);
      font-size: 0.9rem;
      letter-spacing: 0.02em;
    }

    @media (max-width: 480px) {
      .error-card {
        padding: 28px 20px;
      }

      .error-code {
        font-size: 52px;
      }

      .error-title {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="error-code">404</div>
    <h1 class="error-title">Oops! Page Not Found</h1>
    <p class="error-message">
      This page cannot work on your device.
    </p>

    <div class="error-note">Please check the device compatibility and try again.</div>
  </div>
</body>
</html>
